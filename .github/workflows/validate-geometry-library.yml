name: Validate Geometry Library

on:
  push:
    branches: [main]
    paths:
      - geometry_library.json
      - geometry_library.schema.json
      - metadata.schema.json
      - geometry_figure_design_standard.json
      - figures/geometries/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - README.md
      - .gitignore
      - .github/workflows/validate-geometry-library.yml
  pull_request:
    branches: [main]
    paths:
      - geometry_library.json
      - geometry_library.schema.json
      - metadata.schema.json
      - geometry_figure_design_standard.json
      - figures/geometries/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - README.md
      - .gitignore
      - .github/workflows/validate-geometry-library.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate:geometry
      - run: npm run test:geometry
